version: 2
updates:
  # commit-message prefixes keep Dependabot PR titles semantic ("chore(deps): …", "ci(deps): …"),
  # otherwise pr-title.yml rejects them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
