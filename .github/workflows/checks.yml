name: Check Frontend
# Shared quality gate. Called by CI (integration.yml) and by CD (deployment.yml),
# so the very same checks guard pull requests and the deploy.
on:
  workflow_call:

permissions:
  contents: read

# The three jobs run in parallel; callers make build/deploy wait for all of them.
jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Type check (must be 0 errors)
        run: npm run check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Reads package-lock.json only; fails on high or critical advisories.
      - name: npm audit
        run: npm audit --audit-level=high

  test:
    name: Tests (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # The tests use the system Chrome (channel: 'chrome'), preinstalled on ubuntu-latest.
      # Fallback for a runner image without it: install branded Chrome through Playwright.
      - name: Ensure Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            npx playwright install --with-deps chrome
          fi
          google-chrome --version
      # playwright.config.ts builds the site and serves it on :4373 (webServer).
      - name: Run tests
        run: npm test
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
