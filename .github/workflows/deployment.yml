name: CD Pipeline for RenHan MED Web Page

# master -> tests -> build -> GitHub Pages. Strict `needs` chain: when the tests
# fail, nothing is built or published.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    # Docs-only changes don't change the site: no test/deploy run.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/checks.yml

  build:
    name: Build site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site URL
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Where Pages serves the site: https://renhan-med.github.io/webpage now,
      # https://renhan.pl once the custom domain is set. The build follows it (links get the base path).
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci --prefer-offline --no-audit

      # Repo variable SITE_URL overrides the detected URL if ever needed.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke check (non-blocking)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Home page, a sub-page and the stylesheet respond with 200
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for path in / /oferta/; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 10 \
              --retry-all-errors --output /dev/null "${base}${path}"
            echo "OK ${base}${path}"
          done
          # Catches a wrong base path: the page loads but its CSS would 404.
          # The href is root-relative (e.g. /webpage/_astro/x.css), so origin + href is its URL.
          origin=$(echo "$base" | grep -oE '^https?://[^/]+')
          css=$(curl --fail --silent --location "${base}/" | grep -oE 'href="/[^"]+\.css"' | head -1 | cut -d'"' -f2)
          test -n "$css"
          curl --fail --silent --show-error --location --output /dev/null "${origin}${css}"
          echo "OK stylesheet ${origin}${css}"
