name: Validate PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# Read-only token: the action only reads the PR. Explicit, because new repositories default to a
# restricted token and pull_request_target must never get more than it needs.
permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            ci
            chore
          requireScope: false
          wip: true
          validateSingleCommit: false
